name: Build and Publish Docker Image

on:
  # Trigger on push to main (Production)
  push:
    branches: [ "main" ]
  # Trigger on push to any other branch (Development)
  # You can filter this to specific dev branches if you prefer
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

env:
  # Use docker.io for Docker Hub if you prefer
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Set up QEMU for multi-platform support (ARM + x86)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Set up Docker Buildx (The builder engine)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to the Container registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generate metadata (tags, labels) for Docker
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}
          tags: |
            # LOGIC:
            # If this is a Push to Main -> tag is 'latest' AND 'release-YYYYMMDD-HHMM'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=release-{{date 'YYYYMMDD-HHmm'}},enable=${{ github.ref == 'refs/heads/main' }}
            
            # If this is a PR or Dev branch -> tag is 'dev-YYYYMMDD-HHMM'
            type=raw,value=dev-{{date 'YYYYMMDD-HHmm'}},enable=${{ github.ref != 'refs/heads/main' }}

      # 5. Build and Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # This enables the multi-platform build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use caching to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max